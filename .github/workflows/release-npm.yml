name: Release npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to pull binaries from (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Dry run (don't actually publish)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Derive version from tag
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: Download binaries from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          gh release download "${{ inputs.tag }}" --dir release --repo "$GITHUB_REPOSITORY"
          echo "Downloaded binaries:"
          ls -la release/

      - name: Prepare platform packages
        id: prepare_platform
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MISSING_BINARIES=0

          declare -A BINARY_MAP=(
            ["vc-cli-darwin-arm64"]="npm/cli-darwin-arm64/vc-cli"
            ["vc-cli-linux-arm64"]="npm/cli-linux-arm64/vc-cli"
            ["vc-cli-linux-x64"]="npm/cli-linux-x64/vc-cli"
            ["vc-cli-win32-x64.exe"]="npm/cli-win32-x64/vc-cli.exe"
          )

          for release_name in "${!BINARY_MAP[@]}"; do
            dest="${BINARY_MAP[$release_name]}"
            pkg_dir=$(dirname "$dest")

            if [ -f "release/$release_name" ]; then
              cp "release/$release_name" "$dest"
              chmod +x "$dest" 2>/dev/null || true
              jq --arg v "$VERSION" '.version = $v' "$pkg_dir/package.json" > tmp.json && mv tmp.json "$pkg_dir/package.json"
              echo "$pkg_dir:"
              ls -la "$pkg_dir/"
            else
              echo "::warning::No binary found for $release_name"
              MISSING_BINARIES=$((MISSING_BINARIES + 1))
            fi
          done

          echo "missing_binaries=$MISSING_BINARIES" >> "$GITHUB_OUTPUT"

      - name: Validate release binaries
        if: ${{ !inputs.dry_run && steps.prepare_platform.outputs.missing_binaries != '0' }}
        run: |
          echo "::error::Missing ${{ steps.prepare_platform.outputs.missing_binaries }} expected release binaries. Refusing to publish incomplete npm packages."
          exit 1

      - name: Prepare main package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd npm/vc-cli
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies |= with_entries(.value = $v)
          ' package.json > tmp.json && mv tmp.json package.json
          echo "package.json:"
          cat package.json

      - name: Publish platform packages
        if: ${{ !inputs.dry_run }}
        run: |
          for pkg_dir in npm/cli-*; do
            if ls "$pkg_dir"/vc-cli* 1>/dev/null 2>&1; then
              echo "::group::Publishing $(basename $pkg_dir)"
              cd "$pkg_dir"
              npm publish --access public --provenance
              cd "$GITHUB_WORKSPACE"
              echo "::endgroup::"
            else
              echo "::warning::Skipping $(basename $pkg_dir) — no binary"
            fi
          done

      - name: Publish main package
        if: ${{ !inputs.dry_run }}
        run: |
          cd npm/vc-cli
          npm publish --access public --provenance

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "## Dry run — would publish:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for pkg_dir in npm/cli-* npm/vc-cli; do
            name=$(jq -r '.name' "$pkg_dir/package.json")
            version=$(jq -r '.version' "$pkg_dir/package.json")
            has_binary="no"
            ls "$pkg_dir"/vc-cli* 1>/dev/null 2>&1 && has_binary="yes"
            echo "- \`$name@$version\` (binary: $has_binary)" >> $GITHUB_STEP_SUMMARY
          done
